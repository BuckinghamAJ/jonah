name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            platform: darwin/arm64
            artifact: Jonah-macos-arm64
          - name: macos-intel
            os: macos-latest
            platform: darwin/amd64
            artifact: Jonah-macos-intel
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            artifact: Jonah-macos-universal
          # - name: windows-amd64
          #   os: windows-latest
          #   platform: windows/amd64
          #   artifact: Jonah-windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Windows needs GCC for CGO (go-sqlite3)
      - name: Install mingw-w64 (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build --clean --platform ${{ matrix.platform }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CC: gcc
          CGO_ENABLED: "1"
        run: wails build --clean --platform ${{ matrix.platform }}

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ${{ matrix.artifact }}.zip jonah.app

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/jonah.exe -DestinationPath build/bin/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/${{ matrix.artifact }}.zip
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
